<!-- 
  ALTERNATIVE CONTACT FORM USING WEB3FORMS
  This is the EASIEST option - no backend code needed!
  
  To use this:
  1. Sign up at https://web3forms.com (free)
  2. Get your Access Key
  3. Replace YOUR_WEB3FORMS_ACCESS_KEY with your actual key
  4. Copy this entire form block
  5. Replace the current form in contact-us/index.html
-->

<div class="elementor-widget-container">
  <div id="form-message" style="display: none; padding: 15px; margin-bottom: 20px; border-radius: 5px"></div>
  
  <form 
    action="https://api.web3forms.com/submit" 
    method="POST" 
    name="Contact form" 
    id="contact-form"
  >
    <!-- Web3Forms Configuration -->
    <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
    <input type="hidden" name="subject" value="New Contact Form Submission from Serene Touch">
    <input type="hidden" name="from_name" value="Serene Touch Website">
    <input type="hidden" name="redirect" value="https://yourdomain.com/contact-us/?success=1">
    
    <!-- Add recipient email -->
    <input type="hidden" name="email" value="amen@serenetouchcareservices.co.uk">
    
    <!-- Honeypot for spam protection -->
    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
    
    <div class="elementor-form-fields-wrapper elementor-labels-">
      <div
        class="elementor-field-type-text elementor-field-group elementor-column elementor-field-group-name elementor-col-50 elementor-md-100"
      >
        <label for="form-field-name" class="elementor-field-label elementor-screen-only"> Name </label>
        <input
          size="1"
          type="text"
          name="name"
          id="form-field-name"
          class="elementor-field elementor-size-lg elementor-field-textual"
          placeholder="Full Name"
          required
        />
      </div>
      
      <div
        class="elementor-field-type-email elementor-field-group elementor-column elementor-field-group-email elementor-col-50 elementor-md-100 elementor-field-required"
      >
        <label for="form-field-email" class="elementor-field-label elementor-screen-only"> Email </label>
        <input
          size="1"
          type="email"
          name="email"
          id="form-field-email"
          class="elementor-field elementor-size-lg elementor-field-textual"
          placeholder="Email Address"
          required="required"
        />
      </div>
      
      <div
        class="elementor-field-type-text elementor-field-group elementor-column elementor-field-group-field_b268df7 elementor-col-50 elementor-md-100"
      >
        <label for="form-field-phone" class="elementor-field-label elementor-screen-only"> Phone number </label>
        <input
          size="1"
          type="text"
          name="phone"
          id="form-field-phone"
          class="elementor-field elementor-size-lg elementor-field-textual"
          placeholder="Phone Number"
        />
      </div>
      
      <div
        class="elementor-field-type-text elementor-field-group elementor-column elementor-field-group-field_49de01f elementor-col-50 elementor-md-100"
      >
        <label for="form-field-subject" class="elementor-field-label elementor-screen-only"> Subject </label>
        <input
          size="1"
          type="text"
          name="subject"
          id="form-field-subject"
          class="elementor-field elementor-size-lg elementor-field-textual"
          placeholder="Subject"
        />
      </div>
      
      <div
        class="elementor-field-type-textarea elementor-field-group elementor-column elementor-field-group-message elementor-col-100"
      >
        <label for="form-field-message" class="elementor-field-label elementor-screen-only"> Message </label>
        <textarea
          class="elementor-field-textual elementor-field elementor-size-lg"
          name="message"
          id="form-field-message"
          rows="5"
          placeholder="Message"
          required
        ></textarea>
      </div>
      
      <div class="elementor-field-group elementor-column elementor-field-type-submit elementor-col-100 e-form__buttons">
        <button class="elementor-button elementor-size-lg" type="submit">
          <span class="elementor-button-content-wrapper">
            <span class="elementor-button-text">Send Message</span>
          </span>
        </button>
      </div>
    </div>
  </form>
</div>

<!-- JavaScript to handle success message -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const formMessage = document.getElementById("form-message");

    if (urlParams.has("success")) {
      formMessage.style.display = "block";
      formMessage.style.backgroundColor = "#d4edda";
      formMessage.style.color = "#155724";
      formMessage.style.border = "1px solid #c3e6cb";
      formMessage.innerHTML = "<strong>Success!</strong> Your message has been sent successfully. We will get back to you soon.";
      formMessage.scrollIntoView({ behavior: "smooth", block: "center" });

      // Remove URL parameter after 3 seconds
      setTimeout(function () {
        window.history.replaceState({}, document.title, window.location.pathname);
      }, 3000);
    }
  });
</script>
